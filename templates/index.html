<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spotify Clone</title>
    <style>
        body {
            background: #121212;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 24px 24px 140px;
        }

        h1 {
            color: #1db954;
        }

        #search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: none;
            border-radius: 20px;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }

        .song {
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .song:hover {
            background: #2a2a2a;
        }

        .song.active {
            background: #1db954;
            color: #000;
        }

        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #181818;
            padding: 16px 24px;
        }

        .controls {
            margin-top: 8px;
        }

        button {
            background: #1db954;
            border: none;
            border-radius: 20px;
            padding: 8px 18px;
            cursor: pointer;
            margin-right: 8px;
        }

        audio {
            width: 100%;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <h1>Spotify Clone</h1>
    <input id="search" type="text" placeholder="Search by title, artist or album">
    <div id="songs"></div>

    <div class="player">
        <div id="now-playing">Pick a song to start</div>
        <audio id="audio" controls></audio>
        <div class="controls">
            <button id="prev">Previous</button>
            <button id="next">Next</button>
        </div>
    </div>

    <script>
        let songs = [];
        let currentId = null;
        let debounceTimer;

        const list = document.getElementById("songs");
        const audio = document.getElementById("audio");
        const nowPlaying = document.getElementById("now-playing");
        const searchInput = document.getElementById("search");

        async function loadSongs(q = "") {
            const response = await fetch("/api/songs/search?q=" + encodeURIComponent(q));
            const results = await response.json();
            if (q !== searchInput.value.trim()) return; // a newer search replaced this one
            songs = results;
            render();
        }

        function render() {
            list.innerHTML = "";
            if (songs.length === 0) {
                list.textContent = "No songs found";
                return;
            }
            songs.forEach((song) => {
                const row = document.createElement("div");
                row.className = "song" + (song.id === currentId ? " active" : "");
                row.textContent = song.title + " - " + song.artist;
                row.onclick = () => play(song);
                list.appendChild(row);
            });
        }

        function play(song) {
            currentId = song.id;
            audio.src = song.audio_file;
            audio.play();
            nowPlaying.textContent = "Now playing: " + song.title + " - " + song.artist;
            render();
        }

        function step(direction) {
            if (songs.length === 0) return;
            const i = songs.findIndex((s) => s.id === currentId);
            const next = i === -1 ? 0 : (i + direction + songs.length) % songs.length;
            play(songs[next]);
        }

        searchInput.addEventListener("input", () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => loadSongs(searchInput.value.trim()), 300);
        });

        document.getElementById("next").onclick = () => step(1);
        document.getElementById("prev").onclick = () => step(-1);
        audio.addEventListener("ended", () => step(1));

        loadSongs();
    </script>
</body>

</html>
